<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <!-- 桌面绒布质感渐变 -->
    <radialGradient id="tableGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2d7a4f"/>
      <stop offset="70%" stop-color="#1b5e38"/>
      <stop offset="100%" stop-color="#0f3d23"/>
    </radialGradient>

    <!-- 桌面细绒纹理 -->
    <pattern id="felt" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#ffffff" opacity="0.06"/>
      <circle cx="4" cy="4" r="0.5" fill="#ffffff" opacity="0.04"/>
    </pattern>

    <!-- 桌面边缘暗角 -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- 桌面背景 -->
  <rect width="800" height="500" fill="url(#tableGrad)"/>
  <rect width="800" height="500" fill="url(#felt)"/>

  <!-- 桌面中央淡淡的光晕 -->
  <ellipse cx="400" cy="240" rx="320" ry="200" fill="#ffffff" opacity="0.04"/>

  <!-- 桌面边缘暗角 -->
  <rect width="800" height="500" fill="url(#vignette)"/>

  <!-- 桌面上的淡淡反光，增强桌面感 -->
  <ellipse cx="400" cy="470" rx="340" ry="40" fill="#ffffff" opacity="0.03"/>
</svg>