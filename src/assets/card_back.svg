<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <defs>
    <!-- 菱形图案 -->
    <pattern id="diamondPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- 菱形外框 -->
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#c9a84c" stroke-width="1.2"/>
      <!-- 内部小菱形 -->
      <path d="M20 8 L32 20 L20 32 L8 20 Z" fill="none" stroke="#c9a84c" stroke-width="0.8"/>
      <!-- 中心点 -->
      <circle cx="20" cy="20" r="2" fill="#c9a84c"/>
    </pattern>

    <!-- 交叉菱形图案（用于大菱形区域） -->
    <pattern id="diamondCross" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M15 0 L30 15 L15 30 L0 15 Z" fill="none" stroke="#c9a84c" stroke-width="0.7" opacity="0.5"/>
      <path d="M15 5 L25 15 L15 25 L5 15 Z" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.35"/>
    </pattern>

    <!-- 渐变背景 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </radialGradient>

    <!-- 边框渐变 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c95a"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a08030"/>
    </linearGradient>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect x="3" y="3" width="194" height="274" rx="14" ry="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- 内部细边框 -->
  <rect x="10" y="10" width="180" height="260" rx="10" ry="10" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>

  <!-- 大菱形区域 - 中央装饰 -->
  <g transform="translate(100, 140)">
    <!-- 最大菱形 -->
    <path d="M0 -100 L86 0 L0 100 L-86 0 Z" fill="url(#diamondCross)" stroke="#c9a84c" stroke-width="1.5" opacity="0.7"/>

    <!-- 第二层菱形 -->
    <path d="M0 -80 L69 0 L0 80 L-69 0 Z" fill="none" stroke="#e8c95a" stroke-width="1.8"/>

    <!-- 第三层菱形 -->
    <path d="M0 -60 L52 0 L0 60 L-52 0 Z" fill="none" stroke="#c9a84c" stroke-width="1.2"/>

    <!-- 第四层菱形（内部菱形图案填充） -->
    <path d="M0 -40 L35 0 L0 40 L-35 0 Z" fill="url(#diamondPattern)" stroke="#e8c95a" stroke-width="1"/>

    <!-- 最内层小菱形 -->
    <path d="M0 -18 L15 0 L0 18 L-15 0 Z" fill="#c9a84c" opacity="0.8"/>
    <path d="M0 -10 L9 0 L0 10 L-9 0 Z" fill="#e8c95a" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="#fff8e0"/>
  </g>

  <!-- 四角菱形装饰 -->
  <!-- 左上 -->
  <g transform="translate(30, 30) rotate(45)">
    <rect x="-8" y="-8" width="16" height="16" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.7"/>
    <rect x="-4" y="-4" width="8" height="8" fill="none" stroke="#e8c95a" stroke-width="0.6" opacity="0.6"/>
  </g>

  <!-- 右上 -->
  <g transform="translate(170, 30) rotate(45)">
    <rect x="-8" y="-8" width="16" height="16" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.7"/>
    <rect x="-4" y="-4" width="8" height="8" fill="none" stroke="#e8c95a" stroke-width="0.6" opacity="0.6"/>
  </g>

  <!-- 左下 -->
  <g transform="translate(30, 250) rotate(45)">
    <rect x="-8" y="-8" width="16" height="16" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.7"/>
    <rect x="-4" y="-4" width="8" height="8" fill="none" stroke="#e8c95a" stroke-width="0.6" opacity="0.6"/>
  </g>

  <!-- 右下 -->
  <g transform="translate(170, 250) rotate(45)">
    <rect x="-8" y="-8" width="16" height="16" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.7"/>
    <rect x="-4" y="-4" width="8" height="8" fill="none" stroke="#e8c95a" stroke-width="0.6" opacity="0.6"/>
  </g>

  <!-- 上下边缘菱形装饰条 -->
  <!-- 上方 -->
  <g transform="translate(100, 60)">
    <path d="M-60 -10 L-50 0 L-60 10 Z" fill="#c9a84c" opacity="0.5"/>
    <path d="M-40 -10 L-30 0 L-40 10 Z" fill="#e8c95a" opacity="0.6"/>
    <path d="M-20 -10 L-10 0 L-20 10 Z" fill="#c9a84c" opacity="0.5"/>
    <path d="M0 -10 L10 0 L0 10 Z" fill="#e8c95a" opacity="0.6"/>
    <path d="M20 -10 L30 0 L20 10 Z" fill="#c9a84c" opacity="0.5"/>
    <path d="M40 -10 L50 0 L40 10 Z" fill="#e8c95a" opacity="0.6"/>
    <path d="M60 -10 L70 0 L60 10 Z" fill="#c9a84c" opacity="0.5"/>
  </g>

  <!-- 下方 -->
  <g transform="translate(100, 220)">
    <path d="M-60 -10 L-50 0 L-60 10 Z" fill="#c9a84c" opacity="0.5"/>
    <path d="M-40 -10 L-30 0 L-40 10 Z" fill="#e8c95a" opacity="0.6"/>
    <path d="M-20 -10 L-10 0 L-20 10 Z" fill="#c9a84c" opacity="0.5"/>
    <path d="M0 -10 L10 0 L0 10 Z" fill="#e8c95a" opacity="0.6"/>
    <path d="M20 -10 L30 0 L20 10 Z" fill="#c9a84c" opacity="0.5"/>
    <path d="M40 -10 L50 0 L40 10 Z" fill="#e8c95a" opacity="0.6"/>
    <path d="M60 -10 L70 0 L60 10 Z" fill="#c9a84c" opacity="0.5"/>
  </g>

  <!-- 左右边缘菱形装饰 -->
  <!-- 左侧 -->
  <g transform="translate(12, 140)">
    <path d="M0 -30 L8 -20 L0 -10 L-8 -20 Z" fill="#c9a84c" opacity="0.4"/>
    <path d="M0 -10 L8 0 L0 10 L-8 0 Z" fill="#e8c95a" opacity="0.5"/>
    <path d="M0 10 L8 20 L0 30 L-8 20 Z" fill="#c9a84c" opacity="0.4"/>
  </g>

  <!-- 右侧 -->
  <g transform="translate(188, 140)">
    <path d="M0 -30 L8 -20 L0 -10 L-8 -20 Z" fill="#c9a84c" opacity="0.4"/>
    <path d="M0 -10 L8 0 L0 10 L-8 0 Z" fill="#e8c95a" opacity="0.5"/>
    <path d="M0 10 L8 20 L0 30 L-8 20 Z" fill="#c9a84c" opacity="0.4"/>
  </g>

  <!-- 中央大菱形外圈的细节装饰线 -->
  <g transform="translate(100, 140)">
    <path d="M0 -100 L86 0 L0 100 L-86 0 Z" fill="none" stroke="#e8c95a" stroke-width="2.5" opacity="0.4"/>
    <path d="M0 -95 L81 0 L0 95 L-81 0 Z" fill="none" stroke="#c9a84c" stroke-width="0.6" opacity="0.3"/>
    <path d="M0 -105 L91 0 L0 105 L-91 0 Z" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.2"/>
  </g>
</svg>